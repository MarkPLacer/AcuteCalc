name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version on the xcode-27 image (27.0, 27.1, 27.2)"
        required: false
        default: "27.1"

concurrency:
  # Pull requests run in their own group: a run for a PR merged moments earlier reports the base
  # branch as github.ref and must not cancel the push build that updates the release.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: ${{ github.event.inputs.xcode || '27.1' }}

permissions:
  contents: write

jobs:
  core-tests:
    name: AcuteCore tests (Swift 6.4)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: swift test --package-path Packages/AcuteCore --parallel

  smoke-test:
    name: Smoke test (iPad simulator)
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      # Typed key by key into the calculator, then drawn in the Graphs tab (see SmokeTest.swift).
      SMOKE_INPUT: "y=(x+1)^5|y=(x+1)^5→-3|y=(x-2)^2→-1|(x-2)^2→+(y+1)^2→=9|x^2→+y^2→=25|y={sin}x→|y=1/x→|(x+1)^2→=4|2x+y=5;x-y=1"
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Build for the simulator (Debug)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project AcuteCalc.xcodeproj \
            -scheme AcuteCalc \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-simulator.log | xcbeautify --renderer github-actions

      - name: Type the scripted input on an iPad
        timeout-minutes: 15
        run: |
          set -uo pipefail
          # A simulator that does not come up is a runner problem, not an app failure: skip
          # with a warning (the release still updates). Only a crash or hang of the app fails.
          limit() { perl -e 'alarm shift @ARGV; exec @ARGV' "$@"; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ipads = [d for runtime in sorted(devices) if "iOS" in runtime for d in devices[runtime] if "iPad" in d["name"]]
          print(ipads[-1]["udid"] if ipads else "")')
          if [ -z "$DEVICE" ]; then echo "::warning::No iPad simulator on this runner; smoke test skipped"; exit 0; fi
          xcrun simctl list devices | grep "$DEVICE"
          limit 120 xcrun simctl boot "$DEVICE"
          if ! limit 300 xcrun simctl bootstatus "$DEVICE" -b; then
            echo "::warning::The simulator did not finish booting; smoke test skipped"
            exit 0
          fi
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/AcuteCalc.app
          if ! limit 180 xcrun simctl install "$DEVICE" "$APP"; then
            echo "::warning::The app could not be installed on the simulator; smoke test skipped"
            exit 0
          fi
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          SIMCTL_CHILD_ACUTE_SMOKE="$SMOKE_INPUT" perl -e 'alarm shift @ARGV; exec @ARGV' 300 \
            xcrun simctl launch --console --terminate-running-process "$DEVICE" "$BUNDLE" 2>&1 | tee build/smoke.log
          if ! grep -q "SMOKE DONE" build/smoke.log; then
            # Why the process ended: the simulator's own log and its crash reports.
            echo "=== simulator log"
            limit 120 xcrun simctl spawn "$DEVICE" log show --last 5m --style compact \
              --predicate 'process == "AcuteCalc" OR eventMessage CONTAINS[c] "acutecalc"' | tail -150 || true
            find ~/Library/Developer/CoreSimulator/Devices/"$DEVICE"/data/Library/Logs -type f -newer "$APP/Info.plist" 2>/dev/null | head -20
            exit 1
          fi

      - name: Crash reports
        if: failure()
        run: |
          # ReportCrash writes the report a few seconds after the process ends.
          sleep 15
          find ~/Library/Logs/DiagnosticReports -maxdepth 2 -newer build/smoke.log -type f | head -20
          for f in $(find ~/Library/Logs/DiagnosticReports -maxdepth 2 -name "*AcuteCalc*" -type f); do
            echo "=== $f"
            python3 - "$f" <<'EOF'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          report = json.loads(body)
          print("exception:", report.get("exception"))
          print("termination:", report.get("termination"))
          for info in report.get("asi", {}).values():
              print("message:", info)
          images = report.get("usedImages", [])
          for thread in report.get("threads", []):
              if not thread.get("triggered"):
                  continue
              for frame in thread.get("frames", [])[:40]:
                  image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex", -1) < len(images) else "?"
                  where = f'{frame.get("sourceFile", "")}:{frame.get("sourceLine", "")}' if frame.get("sourceFile") else ""
                  print(f'  {image:28} {frame.get("symbol", hex(frame.get("imageOffset", 0)))} {where}')
          EOF
          done

  build-ipa:
    name: Build unsigned IPA (iOS 27 SDK)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project AcuteCalc.xcodeproj \
            -scheme AcuteCalc \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/AcuteCalc.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP/Info.plist"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry "AcuteCalc-unsigned.ipa" Payload)
          ls -lh dist/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AcuteCalc-unsigned-ipa
          path: dist/AcuteCalc-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/AcuteCalc-unsigned.ipa dist/AcuteCalc.ipa
          gh release create "${GITHUB_REF_NAME}" dist/AcuteCalc.ipa \
            --title "Acute Calc ${GITHUB_REF_NAME}" \
            --notes "Nepodpisan IPA za sideloading (iOS in iPadOS 27.0+)." || \
          gh release upload "${GITHUB_REF_NAME}" dist/AcuteCalc.ipa --clobber

  latest-release:
    name: Update the latest release
    # One rolling release: after every green build of main the tag "latest" moves to that
    # commit and its AcuteCalc.ipa is replaced (no new release per commit).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core-tests, build-ipa, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: AcuteCalc-unsigned-ipa
          path: dist

      - name: Replace the IPA of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mv dist/AcuteCalc-unsigned.ipa dist/AcuteCalc.ipa
          if gh api "repos/$GH_REPO/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" > /dev/null
          fi
          SUMMARY=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          NOTES=$(printf '%s\n' \
            "Najnovejši build z veje main (build $BUILD_NUMBER): nepodpisan IPA za sideloading (iOS in iPadOS 27.0+)." \
            "" \
            "Commit [${GITHUB_SHA::7}]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA): $SUMMARY" \
            "" \
            "Stalna povezava do najnovejšega IPA: $GITHUB_SERVER_URL/$GH_REPO/releases/latest/download/AcuteCalc.ipa")
          TITLE="Acute Calc – najnovejši build"
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create latest --verify-tag --title "$TITLE" --notes "$NOTES" --latest
          fi
          gh release upload latest dist/AcuteCalc.ipa --clobber
